# Sample OpenTelemetry Collector configuration running the profiling receiver and
# exporting the corresponding profiles to the http://127.0.0.1:11000 OTLP
# endpoint. Note that the service.profilesSupport feature gate must be enabled
# (e.g. using --feature-gates=+service.profilesSupport CLI argument)
#
# The profiling receiver requires elevated privileges because it relies on
# low-level OS instrumentation (e.g. eBPF, or ptrace). On Linux, this means
# running the Collector as root (sudo) or granting specific capabilities such
# as CAP_SYS_ADMIN, CAP_PERFMON, and/or CAP_BPF, as well as access to /proc.
#
# When running in containers or Kubernetes:
#   - hostPID: true
#   - privileged: true or explicitly adding the required Linux capabilities
#   - mounting kernel-related filesystems (e.g. /sys, /proc) as needed
receivers:
  profiling:
    # Uncomment to override the defaults. Each option is equivalent to the
    # deprecated ebpf-profiler cli flag noted next to it
    # (https://github.com/open-telemetry/opentelemetry-ebpf-profiler/pull/1925).
    # samples_per_second: 20          # -samples-per-second
    # reporter_interval: 5s           # -reporter-interval
    # reporter_jitter: 0.2            # -reporter-jitter
    # monitor_interval: 5s            # -monitor-interval
    # clock_sync_interval: 3m         # -clock-sync-interval
    # probabilistic_interval: 1m      # -probabilistic-interval
    # probabilistic_threshold: 100    # -probabilistic-threshold
    # frame_cache_size: 16384         # -frame-cache-size
    # map_scale_factor: 0             # -map-scale-factor
    # bpf_verifier_log_level: 0       # -bpf-log-level
    # bpf_fs_root: /sys/fs/bpf/       # -bpffs-root
    # no_kernel_version_check: false  # -no-kernel-version-check
    # send_error_frames: false        # -send-error-frames
    # send_idle_frames: false         # -send-idle-frames
    # filter_min_process_age: 0s      # -filter-min-process-age
    # include_env_vars: ""            # -env-vars
    # pin_cpu_ids: ""                 # -pin-cpu-ids
    # obi_process_ctx: false          # -obi-process-ctx
    # verbose_mode: false             # -verbose
    # interpreters:                   # -tracers
    #   python:
    #     disabled: true

# Uncomment to enable the pprof extension for Go profiling of the collector itself.
# extensions:
#   pprof:
#     endpoint: localhost:1777
#
# service:
#   extensions: [pprof]

exporters:
  otlp/local:
    # equivalent to -collection-agent deprecated cli flag
    endpoint: "${env:OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:11000}"
    # equivalent to -disable-tls deprecated cli flag
    tls:
      insecure: true
      insecure_skip_verify: true


service:
  telemetry:
    logs:
      level: info
      # equivalent to -verbose_mode deprecated cli flag
      # level: debug
    # metrics:
    #   level: detailed
    #   readers:
    #     - pull:
    #         exporter:
    #           prometheus:
    #             host: '0.0.0.0'
    #             port: 8888
  pipelines:
    profiles:
      receivers: [profiling]
      exporters: [otlp/local]
