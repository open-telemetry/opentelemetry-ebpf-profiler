# NOTE:
# This builder configuration is NOT used to build any official binary.
# To see the builder manifests used for official binaries,
# check https://github.com/open-telemetry/opentelemetry-collector-releases
#
# For the OpenTelemetry Collector Core official distribution sources, check
# https://github.com/open-telemetry/opentelemetry-collector-releases/tree/main/distributions/otelcol-ebpf-profiler

dist:
  module: go.opentelemetry.io/ebpf-profiler/cmd/otelcol-ebpf-profiler
  name: otelcol-ebpf-profiler
  description: Local OpenTelemetry Collector binary, testing only.
  version: dev
  output_path: ./cmd/otelcol-ebpf-profiler

extensions:
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202640
    import: go.opentelemetry.io/ebpf-profiler/probes/heap
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202640
    import: go.opentelemetry.io/ebpf-profiler/probes/kprobe
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202640
    import: go.opentelemetry.io/ebpf-profiler/probes/offcpu
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202640
    import: go.opentelemetry.io/ebpf-profiler/probes/uprobe
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.162.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202640
    import: go.opentelemetry.io/ebpf-profiler/collector

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.162.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.162.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.162.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.68.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.68.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.68.0

replaces:
  - go.opentelemetry.io/ebpf-profiler => ../../
