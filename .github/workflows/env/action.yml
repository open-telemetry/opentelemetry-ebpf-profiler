name: Common environment setup

inputs:
  go-version:
    description: 'Go version to install (e.g. "stable"). Defaults to the version pinned in go.mod.'
    required: false
    default: ''
  go-build-cache-key:
    description: 'Cache key fragment identifying the job and its matrix flavor for the Go build cache. Defaults to the job id.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Disable man-db
      shell: bash
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - name: Install build dependencies
      shell: bash
      run: |
        # Skip translations to speed up apt-get update
        echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99no-translations > /dev/null
        # Makefile expects ARCH-linux-gnu-gcc; install if not available
        case "$(uname -m)" in
          x86_64)  command -v x86_64-linux-gnu-gcc  >/dev/null || { sudo apt-get update && sudo apt-get install -y gcc-x86-64-linux-gnu; } ;;
          aarch64) command -v aarch64-linux-gnu-gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu; } ;;
        esac
    - name: Install clang 17
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends --no-install-suggests llvm-17 clang-17 clang-format-17
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
        cache: false
      id: go
    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'internal/tools/go.mod', 'internal/tools/go.sum', 'interpreter/go/integrationtests/pprof/go.mod', 'tools/coredump/go.mod', 'tools/coredump/go.sum', 'tools/luajitoffsets/go.mod', 'tools/luajitoffsets/go.sum', 'cmd/otelcol-ebpf-profiler/manifest.yaml') }}
        restore-keys: |
          go-mod-${{ steps.go.outputs.go-version }}-
          go-mod-
      id: go-mod-cache
    - name: Download Go modules
      if: steps.go-mod-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make go-mod-download
    - name: Cache Go build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: go-build-${{ inputs.go-build-cache-key || github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'internal/tools/go.mod', 'internal/tools/go.sum', 'interpreter/go/integrationtests/pprof/go.mod', 'tools/coredump/go.mod', 'tools/coredump/go.sum', 'tools/luajitoffsets/go.mod', 'tools/luajitoffsets/go.sum', 'cmd/otelcol-ebpf-profiler/manifest.yaml') }}
        restore-keys: |
          go-build-${{ inputs.go-build-cache-key || github.job }}-${{ steps.go.outputs.go-version }}-
