<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384" role="img" aria-label="Timeline of one kernel across the application thread, producer, eBPF, profiler and GPU">
<style>
.bg { fill: #FFFFFF; }
.d-zone { fill: #EEF1F5; }
.d-box { fill: #FFFFFF; stroke: #BFC7D3; stroke-width: 1; }
.d-ven { fill: #FBE8D7; stroke: #B3530E; stroke-width: 1.3; }
.d-neu { fill: #DCF0EC; stroke: #0A7A74; stroke-width: 1.3; }
.d-gpu { fill: #E5E4FA; stroke: #4B43C7; stroke-width: 1.3; }
.d-host { fill: #DFEBF8; stroke: #286BAF; stroke-width: 1.3; }
.d-wait { fill: #FFFFFF; stroke: #BFC7D3; stroke-width: 1.1; stroke-dasharray: 4 3; }
.d-kern { fill: #4B43C7; opacity: 0.7; }
.d-t { fill: #121722; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.d-s { fill: #5E6B7E; font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.d-m { fill: #374153; font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.d-zl { fill: #5E6B7E; font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
.d-a { fill: none; stroke: #374153; stroke-width: 1.4; }
.d-a.gpu { stroke: #4B43C7; }
.d-dash { stroke-dasharray: 5 4; }
.d-badge circle { fill: #121722; }
.d-badge text { fill: #FFFFFF; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.mk { fill: #374153; }
.mk.gpu { fill: #4B43C7; }
.fg-root { fill: #E3E7ED; }
.fg-gpu { fill: #CFCAF5; }
.fg-range { fill: #E6D6F6; }
.fg-python { fill: #CFE1F5; }
.fg-producer { fill: #F7D9BE; }
.fg-t { fill: #121722; font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk gpu"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="384" rx="12"/>

        <rect x="130" y="24" width="854" height="56" rx="8" class="d-zone"/>
        <rect x="130" y="88" width="854" height="56" rx="8" class="d-zone"/>
        <rect x="130" y="152" width="854" height="56" rx="8" class="d-zone"/>
        <rect x="130" y="216" width="854" height="56" rx="8" class="d-zone"/>
        <rect x="130" y="280" width="854" height="56" rx="8" class="d-zone"/>
        <text x="16" y="56" class="d-t">App thread</text>
        <text x="16" y="120" class="d-t">Producer</text>
        <text x="16" y="184" class="d-t">eBPF</text>
        <text x="16" y="248" class="d-t">Profiler</text>
        <text x="16" y="312" class="d-t">GPU</text>

        <rect x="164" y="36" width="150" height="32" rx="6" class="d-host"/>
        <text x="176" y="56" class="d-m">cudaLaunchKernel</text>
        <rect x="324" y="40" width="74" height="24" rx="12" class="d-neu"/>
        <text x="361" y="56" text-anchor="middle" class="d-m">id 42</text>

        <path d="M230,68 V98" class="d-a" marker-end="url(#ah)"/>
        <rect x="196" y="100" width="144" height="32" rx="6" class="d-ven"/>
        <text x="208" y="120" class="d-m">LAUNCH, id 42</text>
        <path d="M270,132 V162" class="d-a" marker-end="url(#ah)"/>
        <rect x="212" y="164" width="140" height="32" rx="6" class="d-neu"/>
        <text x="224" y="184" class="d-m">capture stack</text>
        <path d="M352,180 H410 V226" class="d-a" marker-end="url(#ah)"/>
        <text x="418" y="184" class="d-s">processed like a CPU sample</text>
        <rect x="392" y="228" width="180" height="32" rx="6" class="d-neu"/>
        <text x="404" y="248" class="d-m">stack saved under 42</text>

        <rect x="420" y="292" width="260" height="32" rx="6" class="d-gpu"/>
        <text x="434" y="312" class="d-m">vector_add runs, 280 µs</text>

        <path d="M680,308 H700 V116 H714" class="d-a gpu d-dash" marker-end="url(#ahg)"/>
        <text x="708" y="326" class="d-s">times arrive later, in a batch</text>
        <rect x="716" y="100" width="240" height="32" rx="6" class="d-ven"/>
        <text x="728" y="120" class="d-m">KERNEL, id 42</text>
        <path d="M850,132 V162" class="d-a" marker-end="url(#ah)"/>
        <rect x="780" y="164" width="140" height="32" rx="6" class="d-neu"/>
        <text x="792" y="184" class="d-m">forward timing</text>
        <path d="M850,196 V226" class="d-a" marker-end="url(#ah)"/>
        <rect x="760" y="228" width="220" height="32" rx="6" class="d-neu"/>
        <text x="772" y="248" class="d-m">add 280 µs to stack 42</text>

        <g class="d-badge"><circle cx="164" cy="36" r="10"/><text x="164" y="40" text-anchor="middle">1</text></g>
        <g class="d-badge"><circle cx="196" cy="100" r="10"/><text x="196" y="104" text-anchor="middle">2</text></g>
        <g class="d-badge"><circle cx="420" cy="292" r="10"/><text x="420" y="296" text-anchor="middle">3</text></g>
        <g class="d-badge"><circle cx="716" cy="100" r="10"/><text x="716" y="104" text-anchor="middle">4</text></g>
        <g class="d-badge"><circle cx="760" cy="228" r="10"/><text x="760" y="232" text-anchor="middle">5</text></g>

        <path d="M130,360 H980" class="d-a" marker-end="url(#ah)"/>
        <text x="130" y="378" class="d-s">time: steps 3 and 4 can be milliseconds to seconds apart</text>
      
</svg>
